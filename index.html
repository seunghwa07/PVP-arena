<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>능력 대전 아레나</title>
<style>
:root{--bg:#0b0f1a;--panel:#141b2e;--line:#27324f;--accent:#5ac8fa;--txt:#e8ecf6;--dim:#8e9ab8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,11,20,.86);padding:8px;z-index:20}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;max-height:100%;overflow:auto;width:min(760px,100%);touch-action:pan-y}
h1{margin:0 0 4px;font-size:22px;letter-spacing:.5px}
.sub{color:var(--dim);font-size:12px;margin-bottom:12px}
input{width:100%;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0e1424;color:var(--txt);outline:none;-webkit-user-select:text;user-select:text}
input:focus{border-color:var(--accent)}
button{font-size:15px;font-weight:700;padding:10px 14px;border-radius:10px;border:0;background:var(--accent);color:#04131c;cursor:pointer}
button.sec{background:#222c47;color:var(--txt)}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.or{text-align:center;color:var(--dim);font-size:12px;margin:10px 0}
#status{margin-top:10px;font-size:12px;color:var(--dim);min-height:16px}
.lobbywrap{display:flex;gap:12px;flex-wrap:wrap}
.lobbywrap>div{flex:1 1 280px;min-width:0}
.title2{font-size:12px;color:var(--dim);margin:0 0 6px}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:8px;background:#0e1424;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .tag{font-size:11px;color:var(--dim)}
.pl .ok{color:#80ed99;font-weight:700;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.card{position:relative;background:#0e1424;border:2px solid var(--line);border-radius:10px;padding:6px 3px;text-align:center;cursor:pointer}
.card .ic{font-size:24px;line-height:1.1}
.card .n{font-size:11px;font-weight:700;margin-top:2px}
.card .d{font-size:9px;color:var(--dim);margin-top:2px;line-height:1.25;min-height:34px}
.card .cdt{font-size:9px;color:#9ab}
.card.sel{border-color:var(--accent);background:#10233a}
.card .bd{position:absolute;top:-7px;right:-5px;background:var(--accent);color:#04131c;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center}
.card.sel .bd{display:flex}
.hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.4}
#hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;display:flex;justify-content:center;padding:6px}
#score{background:rgba(10,14,26,.7);border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
#score .sp{display:flex;align-items:center;gap:5px;font-weight:700}
#score .rd{color:var(--dim);font-size:12px}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;z-index:6;pointer-events:none;font-weight:900;font-size:64px;text-shadow:0 4px 24px rgba(0,0,0,.8);transition:opacity .25s}
#banner.small{font-size:34px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2a1620;border:1px solid #6b2a3f;color:#ffb3c4;padding:8px 14px;border-radius:10px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.skb{position:fixed;z-index:8;width:68px;height:68px;border-radius:50%;background:rgba(20,27,46,.8);border:2px solid #3a4a74;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;touch-action:none}
.skb .ic{font-size:28px;line-height:1;position:relative;z-index:2}
.skb .key{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:10px;color:#9ab;z-index:2}
.skb .cdf{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);height:0;z-index:1}
.skb .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;z-index:3;text-shadow:0 1px 4px #000}
.skb.down{border-color:var(--accent);background:rgba(40,70,110,.85)}
body.pc .skb{pointer-events:none}
body.pc #b1{left:calc(50% - 76px);bottom:14px}
body.pc #b2{left:calc(50% + 8px);bottom:14px}
body.touch #b1{right:14px;bottom:92px}
body.touch #b2{right:92px;bottom:14px}
#zoneL,#zoneR{position:fixed;top:0;bottom:0;z-index:7;touch-action:none}
#zoneL{left:0;width:42%}
#zoneR{right:0;width:58%}
#rotate{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-size:18px;text-align:center}
#rotate .ph{font-size:56px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
#fs{position:fixed;right:8px;top:8px;z-index:30;padding:6px 10px;font-size:12px}
@media (max-height:430px){.panel{padding:10px}h1{font-size:18px}.card .d{display:none}.card .ic{font-size:20px}.card{padding:4px 2px}}
</style>
</head>
<body class="pc">
<canvas id="c"></canvas>

<div id="hud" class="hidden"><div id="score"></div></div>
<div id="banner" style="opacity:0"></div>
<div id="toast"></div>

<div id="zoneL" class="hidden"></div>
<div id="zoneR" class="hidden"></div>
<div id="b1" class="skb hidden"><div class="cdf"></div><div class="ic"></div><div class="key">Q</div><div class="cdt"></div></div>
<div id="b2" class="skb hidden"><div class="cdf"></div><div class="ic"></div><div class="key">E</div><div class="cdt"></div></div>

<button id="fs" class="sec">전체화면</button>

<div id="menu" class="screen">
  <div class="panel" style="max-width:420px">
    <h1>⚔️ 능력 대전 아레나</h1>
    <div class="sub">능력을 고르고 최대 4명이 실시간으로 맞붙는 난투 · 3라운드 선승</div>
    <div class="col">
      <input id="name" maxlength="10" placeholder="닉네임 (10자 이내)" autocomplete="off">
      <button id="btnCreate">방 만들기</button>
      <div class="or">또는 초대 코드로 참가</div>
      <div class="row">
        <input id="code" class="grow" maxlength="4" placeholder="방 코드 4글자" autocapitalize="characters" autocomplete="off">
        <button id="btnJoin" class="sec">참가</button>
      </div>
    </div>
    <div id="status">서버 연결 중...</div>
  </div>
</div>

<div id="lobby" class="screen hidden">
  <div class="panel">
    <div class="row" style="margin-bottom:10px">
      <h1 class="grow" style="margin:0">대기실 <span id="rcode" style="color:var(--accent);letter-spacing:3px"></span></h1>
      <button id="btnCopy" class="sec">초대 링크 복사</button>
      <button id="btnLeave" class="sec">나가기</button>
    </div>
    <div class="lobbywrap">
      <div>
        <p class="title2">참가자 (<span id="pcount">0</span>/4)</p>
        <div id="plist" class="plist"></div>
        <div class="row" style="margin-top:10px">
          <button id="btnReady" class="grow">준비</button>
          <button id="btnStart" class="grow hidden">게임 시작</button>
        </div>
        <div class="hint" id="lobbyhint"></div>
      </div>
      <div>
        <p class="title2">내 능력 2개 선택 — 슬롯1 <b>Q</b> / 슬롯2 <b>E</b></p>
        <div id="abil" class="grid"></div>
        <div class="hint">새 능력을 누르면 먼저 고른 능력이 교체되고, 선택한 능력을 다시 누르면 슬롯 순서가 바뀌어요.<br>PC: WASD 이동 · 마우스 조준/클릭 공격 · Q/E 능력<br>모바일: 왼쪽 조이스틱 이동 · 오른쪽 조이스틱 조준+공격 · 버튼으로 능력</div>
      </div>
    </div>
  </div>
</div>

<div id="rotate"><div class="ph">📱</div>가로 모드로 돌려주세요</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');
const isTouch = matchMedia('(pointer:coarse)').matches;
document.body.className = isTouch ? 'touch' : 'pc';

let W = 1000, H = 600, WALLS = [], SKILLS = [], SK = {}, myId = 0, maxHp = 100, winRounds = 3;
let ws = null, connected = false, room = null;
const COLORS = ['#4cc9f0', '#f72585', '#ffd166', '#80ed99'];

// ---------- 유틸 ----------
function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200);
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } };
let bannerTimer = 0;
function banner(text, small, ms) {
  const b = $('banner');
  b.textContent = text; b.className = small ? 'small' : ''; b.style.opacity = text ? 1 : 0;
  clearTimeout(bannerTimer);
  if (ms) bannerTimer = setTimeout(() => { b.style.opacity = 0; }, ms);
}

// ---------- 접속 ----------
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const host = new URLSearchParams(location.search).get('server') || location.host || 'localhost:3000';
  ws = new WebSocket(proto + '://' + host);
  ws.onopen = () => { connected = true; $('status').textContent = '연결됨'; };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } onMsg(m); };
  ws.onclose = () => { connected = false; $('status').textContent = '연결이 끊겼어요. 새로고침 해주세요'; toast('서버와 연결이 끊겼어요'); };
}
function onMsg(m) {
  switch (m.t) {
    case 'hello':
      myId = m.id; W = m.W; H = m.H; WALLS = m.walls; SKILLS = m.skills; maxHp = m.maxHp; winRounds = m.winRounds;
      SK = {}; for (const s of SKILLS) SK[s.id] = s;
      break;
    case 'joined': history.replaceState(null, '', '?r=' + m.code); break;
    case 'room': onRoom(m); break;
    case 'err': toast(m.text); break;
    case 'msg': banner(m.text, m.kind === 'round', m.kind === 'match' ? 5500 : 2600); break;
    case 's': onSnap(m); break;
  }
}

// ---------- 메뉴 / 대기실 ----------
$('name').value = lsGet('arena_name') || '';
const q = new URLSearchParams(location.search).get('r');
if (q) $('code').value = q.toUpperCase().slice(0, 4);
$('btnCreate').onclick = () => { lsSet('arena_name', $('name').value); send({ t: 'create', name: $('name').value }); };
$('btnJoin').onclick = () => {
  const c = $('code').value.trim();
  if (c.length !== 4) return toast('방 코드 4글자를 입력해주세요');
  lsSet('arena_name', $('name').value); send({ t: 'join', code: c, name: $('name').value });
};
$('btnLeave').onclick = () => { send({ t: 'leave' }); room = null; showScreen('menu'); history.replaceState(null, '', location.pathname); };
$('btnReady').onclick = () => send({ t: 'ready' });
$('btnStart').onclick = () => send({ t: 'start' });
$('btnCopy').onclick = () => {
  const url = location.origin + location.pathname + '?r=' + (room ? room.code : '');
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('초대 링크를 복사했어요'), () => toast(url));
  else toast(url);
};
$('fs').onclick = () => {
  const el = document.documentElement;
  try { if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen(); } catch (e) { /* ignore */ }
};

function showScreen(which) {
  $('menu').classList.toggle('hidden', which !== 'menu');
  $('lobby').classList.toggle('hidden', which !== 'lobby');
  const inGame = which === 'game';
  $('hud').classList.toggle('hidden', !inGame);
  $('b1').classList.toggle('hidden', !inGame);
  $('b2').classList.toggle('hidden', !inGame);
  $('zoneL').classList.toggle('hidden', !(inGame && isTouch));
  $('zoneR').classList.toggle('hidden', !(inGame && isTouch));
  $('fs').classList.toggle('hidden', inGame && isTouch);
}
function me() { return room && room.players.find(p => p.id === myId); }
function slotOf(id) { const p = room && room.players.find(x => x.id === id); return p ? p.slot : 0; }

function onRoom(m) {
  const prevPhase = room ? room.phase : null;
  room = m;
  if (m.phase === 'lobby') {
    showScreen('lobby'); renderLobby(); banner('', false, 0);
    ents.clear(); projs = []; mines = []; fx.length = 0;
  } else {
    showScreen('game'); updateScore(); setupSkillButtons();
    if (prevPhase === 'lobby' || prevPhase === null) { prevHp = null; }
  }
}
function renderLobby() {
  $('rcode').textContent = room.code;
  $('pcount').textContent = room.players.length;
  const pl = $('plist'); pl.textContent = '';
  for (const p of room.players) {
    const d = document.createElement('div'); d.className = 'pl';
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = COLORS[p.slot % 4];
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.name + (p.id === myId ? ' (나)' : '');
    const ic = document.createElement('span'); ic.className = 'tag'; ic.textContent = p.skills.map(s => (SK[s] ? SK[s].icon : '?')).join(' ');
    const st = document.createElement('span');
    if (p.id === room.host) { st.className = 'tag'; st.textContent = '👑 방장'; }
    else if (p.ready) { st.className = 'ok'; st.textContent = '준비 ✔'; }
    else { st.className = 'tag'; st.textContent = '대기'; }
    d.append(dot, nm, ic, st); pl.appendChild(d);
  }
  const mine = me(), isHost = room.host === myId;
  $('btnReady').classList.toggle('hidden', isHost);
  $('btnStart').classList.toggle('hidden', !isHost);
  if (mine) $('btnReady').textContent = mine.ready ? '준비 취소' : '준비';
  const others = room.players.filter(p => p.id !== room.host);
  const allReady = others.every(p => p.ready);
  $('btnStart').disabled = !(room.players.length >= 2 && allReady);
  $('lobbyhint').textContent = isHost
    ? (room.players.length < 2 ? '친구를 초대해 주세요 (초대 링크 복사)' : (allReady ? '모두 준비 완료! 시작할 수 있어요' : '모두 준비하면 시작할 수 있어요'))
    : '능력을 고르고 준비를 눌러주세요';
  // 능력 카드
  const g = $('abil'); g.textContent = '';
  const sel = mine ? mine.skills : [];
  for (const s of SKILLS) {
    const c = document.createElement('div'); c.className = 'card' + (sel.includes(s.id) ? ' sel' : '');
    const bd = document.createElement('div'); bd.className = 'bd'; bd.textContent = sel.indexOf(s.id) + 1;
    const ic = document.createElement('div'); ic.className = 'ic'; ic.textContent = s.icon;
    const n = document.createElement('div'); n.className = 'n'; n.textContent = s.name;
    const d = document.createElement('div'); d.className = 'd'; d.textContent = s.desc;
    const t = document.createElement('div'); t.className = 'cdt'; t.textContent = '쿨타임 ' + (s.cd / 1000) + '초';
    c.append(bd, ic, n, d, t);
    c.onclick = () => {
      let ns = sel.slice();
      const i = ns.indexOf(s.id);
      if (i >= 0) ns = [ns[1], ns[0]]; else ns = [ns[1], s.id];
      send({ t: 'pick', skills: ns });
    };
    g.appendChild(c);
  }
}
function updateScore() {
  const el = $('score'); el.textContent = '';
  const rd = document.createElement('span'); rd.className = 'rd';
  rd.textContent = 'ROUND ' + room.round + ' · ' + winRounds + '승 선승'; el.appendChild(rd);
  for (const p of room.players) {
    const s = document.createElement('span'); s.className = 'sp';
    const d = document.createElement('span'); d.className = 'dot'; d.style.background = COLORS[p.slot % 4];
    const t = document.createElement('span'); t.textContent = p.name + ' ' + p.wins;
    s.append(d, t); el.appendChild(s);
  }
}
let btnSkillsFor = '';
function setupSkillButtons() {
  const mine = me(); if (!mine) return;
  const key = mine.skills.join(',');
  if (key === btnSkillsFor) return;
  btnSkillsFor = key;
  $('b1').querySelector('.ic').textContent = SK[mine.skills[0]] ? SK[mine.skills[0]].icon : '';
  $('b2').querySelector('.ic').textContent = SK[mine.skills[1]] ? SK[mine.skills[1]].icon : '';
}

// ---------- 입력 ----------
const keys = new Set();
const mouse = { x: 0, y: 0, down: false };
const sticks = { L: { id: null, ox: 0, oy: 0, x: 0, y: 0 }, R: { id: null, ox: 0, oy: 0, x: 0, y: 0 } };
const btn = { s1: false, s2: false };
let lastAim = 0;
const STICK_R = 55;

addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  keys.add(e.code);
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); mouse.down = false; });
canvas.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') { mouse.down = true; mouse.x = e.clientX; mouse.y = e.clientY; } });
addEventListener('pointerup', e => { if (e.pointerType === 'mouse') mouse.down = false; });
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; } });
addEventListener('contextmenu', e => e.preventDefault());

function bindStick(zone, st) {
  zone.addEventListener('pointerdown', e => {
    if (st.id !== null) return;
    st.id = e.pointerId; st.ox = st.x = e.clientX; st.oy = st.y = e.clientY;
    try { zone.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ }
    e.preventDefault();
  });
  zone.addEventListener('pointermove', e => { if (e.pointerId === st.id) { st.x = e.clientX; st.y = e.clientY; } });
  const end = e => { if (e.pointerId === st.id) st.id = null; };
  zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);
}
bindStick($('zoneL'), sticks.L); bindStick($('zoneR'), sticks.R);
function bindBtn(el, name) {
  el.addEventListener('pointerdown', e => { btn[name] = true; el.classList.add('down'); try { el.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } e.preventDefault(); });
  const up = () => { btn[name] = false; el.classList.remove('down'); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
bindBtn($('b1'), 's1'); bindBtn($('b2'), 's2');

function stickVec(st) {
  if (st.id === null) return null;
  const dx = st.x - st.ox, dy = st.y - st.oy, len = Math.hypot(dx, dy);
  const v = Math.min(1, len / STICK_R);
  return { x: len > 0 ? dx / len * v : 0, y: len > 0 ? dy / len * v : 0, len };
}
function computeInput() {
  let mx = 0, my = 0, fire = false, s1 = btn.s1, s2 = btn.s2;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) mx -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) mx += 1;
  if (keys.has('KeyW') || keys.has('ArrowUp')) my -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) my += 1;
  if (keys.has('KeyQ') || keys.has('Digit1')) s1 = true;
  if (keys.has('KeyE') || keys.has('Digit2')) s2 = true;
  const L = stickVec(sticks.L);
  if (L && L.len > 6) { mx = L.x; my = L.y; }
  const R = stickVec(sticks.R);
  if (R && R.len > 10) { lastAim = Math.atan2(R.y, R.x); fire = true; }
  else if (!isTouch) {
    const own = ents.get(myId);
    if (own) {
      const wx = (mouse.x - view.ox) / view.sc, wy = (mouse.y - view.oy) / view.sc;
      lastAim = Math.atan2(wy - own.y, wx - own.x);
    }
    fire = mouse.down;
  }
  return { t: 'i', mx, my, a: +lastAim.toFixed(3), f: fire, s1, s2 };
}
setInterval(() => { if (room && room.phase !== 'lobby') send(computeInput()); }, 33);

// ---------- 상태 ----------
const ents = new Map();
let projs = [], mines = [];
const fx = [];
const snap = { t: 0, ph: 'lobby', tm: 0 };
let prevHp = null, shake = 0, lastPhase = '';

function onSnap(m) {
  const now = performance.now();
  if (m.ph === 'countdown' && lastPhase !== 'countdown') { for (const e of ents.values()) { e.x = e.tx; e.y = e.ty; } }
  if (m.ph === 'countdown') banner(String(Math.max(1, Math.ceil(m.tm / 1000))), false, 0);
  else if (m.ph === 'fight' && lastPhase === 'countdown') banner('FIGHT!', false, 800);
  lastPhase = m.ph;
  snap.t = now; snap.ph = m.ph; snap.tm = m.tm;
  const seen = new Set();
  for (const a of m.p) {
    const [id, x, y, aim, hp, fl, c1, c2] = a;
    let e = ents.get(id);
    if (!e) { e = { x, y, tx: x, ty: y, hp, aim, alive: true }; ents.set(id, e); }
    if (hp < e.hp) {
      fx.push({ k: 'dmg', x, y: y - 24, v: e.hp - hp, t0: now, dur: 700 });
      if (id === myId) { shake = 7; if (navigator.vibrate) navigator.vibrate(25); }
    }
    e.tx = x; e.ty = y; e.aim = aim; e.hp = hp;
    e.alive = !!(fl & 1); e.shield = !!(fl & 2); e.slow = !!(fl & 4); e.dash = !!(fl & 8);
    e.c1 = c1; e.c2 = c2; e.ct = now;
    seen.add(id);
  }
  for (const id of [...ents.keys()]) if (!seen.has(id)) ents.delete(id);
  projs = m.b.map(b => ({ x: b[0], y: b[1], r: b[2], kind: b[3], owner: b[4], vx: b[5], vy: b[6] }));
  mines = m.m.map(b => ({ x: b[0], y: b[1], owner: b[2], armed: !!b[3] }));
  for (const ev of m.e) addFx(ev, now);
}
function addFx(ev, now) {
  switch (ev.k) {
    case 'hit': fx.push({ k: 'spark', x: ev.x, y: ev.y, t0: now, dur: 260, c: '#fff' }); break;
    case 'block': fx.push({ k: 'ring', x: ev.x, y: ev.y, r: 34, t0: now, dur: 300, c: '#8ff' }); break;
    case 'boom': fx.push({ k: 'boom', x: ev.x, y: ev.y, r: ev.r, t0: now, dur: 380 }); shake = Math.max(shake, 4); break;
    case 'nova': fx.push({ k: 'nova', x: ev.x, y: ev.y, r: ev.r, t0: now, dur: 450 }); break;
    case 'beam': fx.push({ k: 'beam', x: ev.x1, y: ev.y1, x2: ev.x2, y2: ev.y2, t0: now, dur: 220, c: '#fff35c' }); break;
    case 'blink':
      fx.push({ k: 'beam', x: ev.x1, y: ev.y1, x2: ev.x2, y2: ev.y2, t0: now, dur: 260, c: '#b79bff' });
      fx.push({ k: 'ring', x: ev.x1, y: ev.y1, r: 30, t0: now, dur: 300, c: '#b79bff' });
      fx.push({ k: 'ring', x: ev.x2, y: ev.y2, r: 30, t0: now, dur: 300, c: '#b79bff' });
      break;
    case 'heal': fx.push({ k: 'heal', x: ev.x, y: ev.y, t0: now, dur: 800 }); break;
    case 'die': fx.push({ k: 'spark', x: ev.x, y: ev.y, t0: now, dur: 700, c: '#ff6b6b', big: true }); shake = Math.max(shake, 9); break;
  }
}

// ---------- 렌더 ----------
const view = { sc: 1, ox: 0, oy: 0 };
let dpr = 1, cw = 0, ch = 0;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cw = innerWidth; ch = innerHeight;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
}
addEventListener('resize', resize); resize();

function drawArena() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#121a30'); g.addColorStop(1, '#0d1325');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(120,150,220,.08)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 50) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += 50) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  for (const w of WALLS) {
    ctx.fillStyle = '#2a3558'; ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = '#5a6fa8'; ctx.lineWidth = 2; ctx.strokeRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);
  }
  ctx.strokeStyle = '#4a5c94'; ctx.lineWidth = 4; ctx.strokeRect(0, 0, W, H);
}
function drawPlayer(id, e, now) {
  const col = COLORS[slotOf(id) % 4], R = 18;
  const info = room && room.players.find(p => p.id === id);
  ctx.save();
  ctx.translate(e.x, e.y);
  if (!e.alive) {
    ctx.globalAlpha = 0.35; ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(8, 8); ctx.moveTo(8, -8); ctx.lineTo(-8, 8); ctx.stroke();
    ctx.restore(); return;
  }
  if (e.dash) { ctx.globalAlpha = 0.3; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(-Math.cos(e.aim) * 18, -Math.sin(e.aim) * 18, R, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
  // 몸
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.arc(0, 0, R - 5, 0, 7); ctx.fill();
  // 포신
  ctx.rotate(e.aim);
  ctx.fillStyle = '#fff'; ctx.fillRect(R - 4, -4, 14, 8);
  ctx.rotate(-e.aim);
  if (e.slow) { ctx.strokeStyle = '#7fd4ff'; ctx.lineWidth = 3; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(0, 0, R + 4, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
  if (e.shield) {
    ctx.strokeStyle = 'rgba(120,255,255,' + (0.6 + 0.3 * Math.sin(now / 80)) + ')'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, R + 8, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(120,255,255,.12)'; ctx.fill();
  }
  // 체력바
  const bw = 44, hpr = Math.max(0, e.hp / maxHp);
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(-bw / 2, -R - 14, bw, 6);
  ctx.fillStyle = hpr > 0.5 ? '#6be585' : hpr > 0.25 ? '#ffd166' : '#ff5c5c';
  ctx.fillRect(-bw / 2, -R - 14, bw * hpr, 6);
  ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText((info ? info.name : '') + (id === myId ? ' ★' : ''), 0, -R - 18);
  ctx.restore();
}
function drawFx(now) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i], p = (now - f.t0) / f.dur;
    if (p >= 1) { fx.splice(i, 1); continue; }
    ctx.save();
    switch (f.k) {
      case 'boom': {
        ctx.globalAlpha = 1 - p;
        const r = f.r * (0.3 + 0.7 * p);
        const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
        g.addColorStop(0, 'rgba(255,240,150,.9)'); g.addColorStop(0.5, 'rgba(255,120,40,.6)'); g.addColorStop(1, 'rgba(255,60,0,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, 7); ctx.fill();
        break;
      }
      case 'nova':
        ctx.globalAlpha = (1 - p) * 0.8; ctx.strokeStyle = '#a8e6ff'; ctx.lineWidth = 6 * (1 - p) + 2;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * p, 0, 7); ctx.stroke();
        ctx.fillStyle = 'rgba(150,220,255,.18)'; ctx.fill();
        break;
      case 'beam':
        ctx.globalAlpha = 1 - p; ctx.strokeStyle = f.c; ctx.lineWidth = 8 * (1 - p) + 2; ctx.lineCap = 'round';
        ctx.shadowColor = f.c; ctx.shadowBlur = 16;
        ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x2, f.y2); ctx.stroke();
        break;
      case 'ring':
        ctx.globalAlpha = 1 - p; ctx.strokeStyle = f.c; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.5 + p), 0, 7); ctx.stroke();
        break;
      case 'spark': {
        ctx.globalAlpha = 1 - p; ctx.strokeStyle = f.c; ctx.lineWidth = 3;
        const n = f.big ? 14 : 7, r0 = 8 + p * (f.big ? 50 : 24);
        ctx.beginPath();
        for (let a = 0; a < n; a++) {
          const ang = a / n * Math.PI * 2 + 0.4;
          ctx.moveTo(f.x + Math.cos(ang) * r0, f.y + Math.sin(ang) * r0);
          ctx.lineTo(f.x + Math.cos(ang) * (r0 + 8), f.y + Math.sin(ang) * (r0 + 8));
        }
        ctx.stroke();
        break;
      }
      case 'heal':
        ctx.globalAlpha = 1 - p; ctx.fillStyle = '#6be585'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('+', f.x - 14, f.y - 20 - p * 30); ctx.fillText('+', f.x + 14, f.y - 10 - p * 40);
        break;
      case 'dmg':
        ctx.globalAlpha = 1 - p * p; ctx.fillStyle = '#ffd6d6'; ctx.strokeStyle = '#300'; ctx.lineWidth = 3;
        ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
        ctx.strokeText('-' + f.v, f.x, f.y - p * 28); ctx.fillText('-' + f.v, f.x, f.y - p * 28);
        break;
    }
    ctx.restore();
  }
}
function drawSticks() {
  if (!isTouch || !room || room.phase === 'lobby') return;
  for (const st of [sticks.L, sticks.R]) {
    if (st.id === null) continue;
    const dx = st.x - st.ox, dy = st.y - st.oy, len = Math.hypot(dx, dy) || 1, v = Math.min(len, STICK_R);
    ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(st.ox, st.oy, STICK_R, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    ctx.beginPath(); ctx.arc(st.ox + dx / len * v, st.oy + dy / len * v, 22, 0, 7); ctx.fill();
  }
}
function updateButtons(now) {
  for (const [id, key] of [['b1', 'c1'], ['b2', 'c2']]) {
    const el = $(id), own = ents.get(myId);
    const rem = own ? Math.max(0, own[key] - (now - own.ct)) : 0;
    const sk = room && me() ? SK[me().skills[id === 'b1' ? 0 : 1]] : null;
    const frac = sk && rem > 0 ? Math.min(1, rem / sk.cd) : 0;
    el.querySelector('.cdf').style.height = (frac * 100) + '%';
    el.querySelector('.cdt').textContent = rem > 0 ? (rem / 1000).toFixed(rem > 1000 ? 0 : 1) : '';
  }
}
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  view.sc = Math.min(cw / W, ch / H) * 0.98;
  view.ox = (cw - W * view.sc) / 2; view.oy = (ch - H * view.sc) / 2;
  let sx = 0, sy = 0;
  if (shake > 0.3) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; shake *= 0.86; } else shake = 0;
  ctx.translate(view.ox + sx, view.oy + sy); ctx.scale(view.sc, view.sc);
  drawArena();
  const inGame = room && room.phase !== 'lobby';
  if (inGame) {
    for (const m of mines) {
      ctx.fillStyle = m.armed ? COLORS[slotOf(m.owner) % 4] : 'rgba(255,255,255,.25)';
      ctx.beginPath(); ctx.arc(m.x, m.y, 9, 0, 7); ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
      if (m.armed) { ctx.strokeStyle = 'rgba(255,80,80,' + (0.4 + 0.4 * Math.sin(now / 150)) + ')'; ctx.beginPath(); ctx.arc(m.x, m.y, 14, 0, 7); ctx.stroke(); }
    }
    for (const e of ents.values()) {
      const k = Math.min(1, dt * 22);
      e.x += (e.tx - e.x) * k; e.y += (e.ty - e.y) * k;
    }
    for (const [id, e] of ents) drawPlayer(id, e, now);
    const age = Math.min(0.1, (now - snap.t) / 1000);
    for (const b of projs) {
      const x = b.x + b.vx * age, y = b.y + b.vy * age, col = COLORS[slotOf(b.owner) % 4];
      if (b.kind === 1) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, b.r * 2);
        g.addColorStop(0, '#fff6b0'); g.addColorStop(0.5, '#ff8a2b'); g.addColorStop(1, 'rgba(255,60,0,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, b.r * 2, 0, 7); ctx.fill();
      } else {
        ctx.strokeStyle = col; ctx.lineWidth = b.r * 0.8; ctx.lineCap = 'round'; ctx.globalAlpha = 0.5;
        ctx.beginPath(); ctx.moveTo(x - b.vx * 0.025, y - b.vy * 0.025); ctx.lineTo(x, y); ctx.stroke(); ctx.globalAlpha = 1;
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, b.r, 0, 7); ctx.fill();
      }
    }
    drawFx(now);
    // 조준선 (내 캐릭터)
    const own = ents.get(myId);
    if (own && own.alive && snap.ph === 'fight') {
      ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2; ctx.setLineDash([6, 8]);
      ctx.beginPath(); ctx.moveTo(own.x + Math.cos(own.aim) * 34, own.y + Math.sin(own.aim) * 34);
      ctx.lineTo(own.x + Math.cos(own.aim) * 110, own.y + Math.sin(own.aim) * 110); ctx.stroke(); ctx.setLineDash([]);
    }
    updateButtons(now);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawSticks();
}
requestAnimationFrame(frame);

connect();
})();
</script>
